<div class="reset-container">
  <mat-card style="width: 100%; max-width: 450px;">
    <mat-card-header style="display: flex; justify-content: center;">
      <mat-card-title>Recupera tu cuenta</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p style="text-align: center; margin-bottom: 24px;">
        Ingresa tu usuario y correo electrónico para reestablecer tu cuenta.
      </p>

      <form [formGroup]="restablecerForm" (ngSubmit)="restablecePassword()" style="display: flex; flex-direction: column;">
        <mat-form-field appearance="outline" style="width: 100%">
          <mat-label>usuario</mat-label>
          <input matInput formControlName="usuario" required>
        </mat-form-field>
        <mat-form-field appearance="outline" style="width: 100%">
          <mat-label>Correo electrónico</mat-label>
          <input matInput formControlName="email" required>
        </mat-form-field>

        <div style="display: flex; justify-content: flex-end; gap: 8px;">
          <button mat-stroked-button type="button" (click)="onCancel()">Cancelar</button>
          <button mat-raised-button color="primary" type="submit">Enviar</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
